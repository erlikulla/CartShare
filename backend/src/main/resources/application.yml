spring:
  application:
    name: cartshare-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cartshare}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:ndjonerlikulla6002}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    user:
      name: admin
      password: admin

server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-make-it-at-least-256-bits}
  expiration: 86400000

# Comma-separated list, read by SecurityConfig's CORS setup below.
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
